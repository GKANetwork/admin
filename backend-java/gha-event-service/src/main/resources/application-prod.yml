# ===================================================================
# PROD PROFILE (application-prod.yml)
# Run on Hosting Raja VPS with: SPRING_PROFILES_ACTIVE=prod
# Uses Production SeaweedFS (Master :9333, S3 :8333) + bucket 'gha-files'
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    discovery:
      enabled: ${EUREKA_ENABLED:false}
    service-registry:
      auto-registration:
        enabled: ${EUREKA_ENABLED:false}
  data:
    mongodb:
      uri: ${GHA_MONGO_URI:mongodb://mongodb:27017/event}
      database: ${GHA_MONGO_DB:event}

gha:
  environment: prod
  blob-store:
    provider: ${GHA_BLOB_PROVIDER:seaweedfs}
    collection: ${GHA_BLOB_COLLECTION:gha-files}
    base-path: ${GHA_BLOB_STORE_PATH:/gha-files}
    seaweedfs-master-url: ${GHA_SEAWEEDFS_ENDPOINT:http://103.118.17.94:9333}
    seaweedfs-filer-url: ${GHA_SEAWEEDFS_FILER_URL:http://seaweedfs:8888}
    seaweedfs-s3-url: ${GHA_SEAWEEDFS_S3_URL:http://103.118.17.94:8333}
    s3-access-key: ${GHA_S3_ACCESS_KEY:admin}
    s3-secret-key: ${GHA_S3_SECRET_KEY:qapassw0rd}
    s3-region: ${GHA_S3_REGION:us-east-1}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

logging:
  level:
    root: WARN
    com.gha.eventservice: INFO
  file:
    name: /var/log/gha/gha-event-service-prod.log
