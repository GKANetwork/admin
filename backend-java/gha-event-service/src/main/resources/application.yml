server:
  port: ${GHA_EVENT_SERVICE_PORT:8082}

spring:
  application:
    name: gha-event-service
  profiles:
    # Supported profiles: dev | qa | prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
  data:
    mongodb:
      uri: ${GHA_MONGO_URI:mongodb://localhost:27017/event}
      database: ${GHA_MONGO_DB:event}

  cloud:
    discovery:
      enabled: ${EUREKA_ENABLED:false}
    service-registry:
      auto-registration:
        enabled: ${EUREKA_ENABLED:false}

# Default Blob store configuration (SeaweedFS Master :9333 + S3 :8333 with bucket 'gha-files')
gha:
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  blob-store:
    provider: ${GHA_BLOB_PROVIDER:seaweedfs}
    collection: ${GHA_BLOB_COLLECTION:gha-files}
    base-path: ${GHA_BLOB_STORE_PATH:/gha-files}
    seaweedfs-master-url: ${GHA_SEAWEEDFS_ENDPOINT:http://103.118.17.94:9333}
    seaweedfs-filer-url: ${GHA_SEAWEEDFS_FILER_URL:http://127.0.0.1:8888}
    seaweedfs-s3-url: ${GHA_SEAWEEDFS_S3_URL:http://103.118.17.94:8333}
    s3-access-key: ${GHA_S3_ACCESS_KEY:admin}
    s3-secret-key: ${GHA_S3_SECRET_KEY:qapassw0rd}
    s3-region: ${GHA_S3_REGION:us-east-1}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

