server:
  port: ${GHA_EVENT_SERVICE_PORT:8082}

spring:
  application:
    name: gha-event-service
  profiles:
    # Supported profiles: dev | qa | prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
  data:
    mongodb:
      uri: ${GHA_MONGO_URI:mongodb://localhost:27017/event_db}
      database: ${GHA_MONGO_DB:event_db}

# Default Blob store configuration (overridden per profile in application-dev/qa/prod.yml)
gha:
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  blob-store:
    provider: ${GHA_BLOB_PROVIDER:local-fs}
    base-path: ${GHA_BLOB_STORE_PATH:/seaweedfs/buckets/gha-event-media/landing-sections}
    seaweedfs-filer-url: ${GHA_SEAWEEDFS_ENDPOINT:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
