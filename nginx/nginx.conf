worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    client_max_body_size 25M;
    upstream gha_gateway_upstream { server gha-gateway:8080; }
    upstream gha_admin_ui { server admin-ui:3000; }
    server {
        listen 80;
        server_name _;
        # Place behind HTTPS in production and set AUTH_PUBLIC_ORIGIN to the external origin.
        # The BFF translates HttpOnly employee cookies to server-side bearer requests.
        location / { proxy_pass http://gha_admin_ui; proxy_set_header Host $http_host; }
        location /api/v1/auth/internal/ { proxy_pass http://gha_admin_ui; proxy_set_header Host $http_host; }
        location /api/v1/auth/admin/ { proxy_pass http://gha_admin_ui; proxy_set_header Host $http_host; }
        location /api/v1/events/ { proxy_pass http://gha_admin_ui; proxy_set_header Host $http_host; }
        # External/mobile auth and other API services keep using the gateway.
        location /api/ {
            proxy_pass http://gha_gateway_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
